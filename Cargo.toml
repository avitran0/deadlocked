[workspace]
members = ["cheat", "server", "shared"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.dependencies]
shared.path = "shared"

utils.git = "https://codeberg.org/avitrano/utils"

glam = { version = "0.33", features = ["bytemuck", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
uuid = { version = "1.26", features = ["v4", "serde"] }

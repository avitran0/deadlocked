name: Build and Package

on:
  push:
    branches: [ rust ]
  pull_request:
    branches: [ rust ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release
        run: cargo build --release

      - name: Prepare Artifact
        run: |
          mkdir -p build
          cp target/release/deadlocked build/
          cp -r resources build/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadlocked-ubuntu-binary
          path: build/
